  <!-- Grampo superior da prancheta -->
  <rect x="23" y="6" width="18" height="9" rx="4.5" fill="#0b3b36"/>
  <rect x="27" y="8" width="10" height="3" rx="1.5" fill="#5eead4"/>

  <!-- Tarefa 1 (Checkmark + linha de tarefa) -->
  <path d="M18 24 L22.5 28.5 L31 19.5" fill="none" stroke="#0f766e" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="35" y="22" width="11" height="4" rx="2" fill="#64748b"/>

  <!-- Tarefa 2 (Checkmark + linha de tarefa) -->
