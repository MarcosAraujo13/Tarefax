<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/style.css">

    <title>Tarefax</title>
</head>

<body>
    <header class="cabeçalho">
        <h1>Tarefax</h1>
        <p>Organize suas tarefas</p>
    </header>

    <form id="formTarefas" class="formTarefas">
        <label for="nome">Qual o nome da sua tarefa?</label>
        <input type="text" id="nome" required>

        <label for="descricao">Descrição da tarefa</label>
        <input type="text" id="descricao" required>

        <label for="dataEntrega">Data de entrega</label>
        <input type="date" id="dataEntrega" required>

        <button id="botaoEnviar"  type="submit">Adicionar</button>
    </form>

    <section class="listaTarefas">
        <h2>Minhas Tarefas</h2>
        <ul id="listaTarefas"></ul>
    </section>

    <button id="botaoApagar" type="button"> Apagar tarefas</button>

    <script type="module" src="./JS/script.js"></script>
</body>
</html>
